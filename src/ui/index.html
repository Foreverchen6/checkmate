<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;"
    />
    <title>Xiangqi</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <section class="board-pane">
        <div id="online-bar" class="online-bar" hidden>
          <span id="online-bar-text">联机</span>
          <span id="online-bar-clock" class="online-bar-clock"></span>
        </div>
        <div class="board-wrap">
          <svg
            id="board"
            viewBox="0 0 800 890"
            preserveAspectRatio="xMidYMid meet"
            role="img"
            aria-label="中国象棋棋盘"
          ></svg>
        </div>
        <div class="quick-actions">
          <button id="undo" title="回退一步（推演中为上一步）">悔棋</button>
          <button id="sim-prev" hidden title="回到推演中的上一步">上一步</button>
          <button id="sim-next" hidden title="重走已回退的推演着法">下一步</button>
          <button id="hint" title="提示：再次点击关闭">提示</button>
          <button id="simulate" title="进入推演">推演</button>
        </div>
        <div class="statusbar">
          <div class="status-main">
            <span id="turn" class="turn red">红方行棋</span>
            <span id="eval" class="eval">
              <span id="eval-score">评估中</span><span id="eval-quality" class="quality"></span>
            </span>
            <span class="spacer"></span>
            <span id="engine" class="engine">启动中</span>
            <button id="toggle-panel" class="icon" title="菜单">☰</button>
          </div>
          <p id="message" class="message">准备开始</p>
        </div>
      </section>

      <aside class="controls">
        <div class="row">
          <select id="side" aria-label="我方">
            <option value="red">红方</option>
            <option value="black">黑方</option>
          </select>
          <select id="level" aria-label="难度">
            <option value="1">入门</option>
            <option value="2" selected>进阶</option>
            <option value="3">高手</option>
          </select>
        </div>

        <div class="row">
          <button id="new-game">新局</button>
          <button id="resign">认输</button>
          <button id="review">复盘</button>
          <button id="restart-engine" class="ghost" title="重启引擎">↻</button>
          <button id="retry" class="ghost" hidden>重试</button>
        </div>

        <div class="row">
          <button id="online" title="联机对战">联机</button>
        </div>

        <div class="row">
          <button id="save" title="保存当前对局">保存</button>
          <button id="load" title="载入存档">载入</button>
          <button id="import-fen" title="导入 FEN 局面">导入局面</button>
        </div>

        <p id="record" class="record"></p>

        <details id="archive-panel">
          <summary>存档</summary>
          <div class="row">
            <button id="export-game">导出对局…</button>
            <button id="import-file">从文件载入…</button>
          </div>
          <div id="archive-list" class="archive-list"></div>
        </details>

        <details id="shortcut-panel">
          <summary>快捷键</summary>
          <div id="shortcut-list" class="shortcut-list"></div>
          <div class="row">
            <button id="reset-shortcuts">恢复默认</button>
          </div>
        </details>

        <details id="moves-panel">
          <summary>棋谱</summary>
          <div id="move-list" class="move-list"></div>
        </details>

        <details id="review-panel">
          <summary>复盘</summary>
          <div id="review-body" class="review-body"></div>
        </details>
      </aside>
    </div>

    <div id="online-modal" class="modal" hidden>
      <div class="modal-box online-box">
        <h2>联机对战</h2>

        <div class="online-tabs">
          <button id="online-tab-host" type="button" class="active">开房间</button>
          <button id="online-tab-guest" type="button">加入房间</button>
        </div>

        <section id="online-host-pane">
          <div class="row">
            <select id="online-host-side" aria-label="房主执方">
              <option value="red">房主执红</option>
              <option value="black">房主执黑</option>
            </select>
            <button id="online-create" type="button">生成邀请链接</button>
          </div>
          <label class="online-label" for="online-url">邀请链接</label>
          <div class="row">
            <input id="online-url" readonly placeholder="创建后生成" />
            <button id="online-copy" type="button" class="ghost" disabled>复制</button>
          </div>
          <div id="online-host-state" class="online-state">未创建</div>
          <div id="online-join-request" class="online-request" hidden>
            <span>有玩家请求加入</span>
            <div class="row">
              <button id="online-accept" type="button">同意</button>
              <button id="online-reject" type="button" class="ghost">拒绝</button>
            </div>
          </div>
          <div class="row">
            <button id="online-stop" type="button" class="ghost" disabled>结束联机</button>
          </div>
        </section>

        <section id="online-guest-pane" hidden>
          <label class="online-label" for="online-join-url">邀请链接</label>
          <textarea
            id="online-join-url"
            rows="3"
            spellcheck="false"
            placeholder="粘贴房主发来的链接"
          ></textarea>
          <div class="row">
            <button id="online-join" type="button">加入</button>
            <button id="online-leave" type="button" class="ghost" disabled>离开</button>
          </div>
          <div id="online-guest-state" class="online-state">未加入</div>
        </section>

        <div id="online-game" class="online-game" hidden>
          <div id="online-clock" class="online-clock">等待开始</div>
          <div id="online-connection" class="online-state"></div>
          <div id="online-pending" class="online-pending" hidden>
            <span id="online-pending-text"></span>
            <div class="row">
              <button id="online-pending-accept" type="button">同意</button>
              <button id="online-pending-reject" type="button" class="ghost">拒绝</button>
              <button id="online-pending-cancel" type="button" class="ghost" hidden>撤回</button>
            </div>
          </div>
          <div class="row">
            <button id="online-undo" type="button">悔棋</button>
            <button id="online-draw" type="button">求和</button>
            <button id="online-resign" type="button" class="ghost">认输</button>
          </div>
        </div>

        <p id="online-error" class="modal-error"></p>
        <div class="modal-actions">
          <button id="online-close" type="button" class="ghost">关闭</button>
        </div>
      </div>
    </div>
    <div id="fen-modal" class="modal" hidden>
      <div class="modal-box">
        <h2>导入局面</h2>
        <p class="muted">粘贴 FEN 后从该局面开始新对局。</p>
        <textarea
          id="fen-input"
          rows="4"
          spellcheck="false"
          placeholder="rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR w - - 0 1"
        ></textarea>
        <p id="fen-error" class="modal-error"></p>
        <div class="modal-actions">
          <button id="fen-cancel" class="ghost">取消</button>
          <button id="fen-confirm">开始</button>
        </div>
      </div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
